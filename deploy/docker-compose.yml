# PlayHack local stack — IMPLEMENTATION.md §2.1
#
# Nothing here needs the internet at demo time. Venue wifi must not be able to
# break the race demo.
#
# Phase 15 (M3/M5) uncomments postgres-replica, prometheus and grafana below.

name: playhack

services:
  postgres:
    image: postgres:16-alpine
    container_name: playhack-postgres
    environment:
      POSTGRES_USER: playhack
      POSTGRES_PASSWORD: playhack
      POSTGRES_DB: playhack
      # PgBouncer holds the plaintext password in userlist.txt and speaks md5 to
      # clients; md5 here keeps that path simple for the dev stack.
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    command:
      - postgres
      - -c
      - password_encryption=md5
      - -c
      - max_connections=200
      # Concurrent inserts for overlapping windows can form a genuine lock cycle
      # while checking the exclusion constraint (each places its index tuple
      # before scanning). The default 1s detection makes a deadlocked loser
      # 1s slow, which blows the p99<150ms rejection target. Booking
      # transactions are ~1ms, so legitimate waits never approach this.
      - -c
      - deadlock_timeout=50ms
    ports:
      # Host port is overridable: a locally-installed PostgreSQL binds
      # 127.0.0.1:5432 first and silently wins over Docker's wildcard bind.
      # Export POSTGRES_HOST_PORT=55432 (and friends) if you have one.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-replication.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playhack -d playhack"]
      interval: 2s
      timeout: 3s
      retries: 30

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    container_name: playhack-pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PGBOUNCER_HOST_PORT:-6432}:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: playhack-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # --- M5 observability. `make dev` brings these up with the rest. ------------
  #
  # Neither one is on the booking path. Prometheus scrapes, Grafana draws, and if
  # both are down the API is exactly as correct — which is the only reason they
  # are allowed to be here at all on a demo stack that must not depend on the
  # network.

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: playhack-prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # The API runs on the HOST (`make run`), not in this compose file, so the
    # scrape target has to leave the bridge network. Docker Desktop resolves
    # host.docker.internal; this alias makes the same name work on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: playhack-grafana
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: playhack
      # Anonymous viewing, at Admin. This is a laptop demo behind a projector:
      # a login prompt between the judge and the surge dashboard is friction with
      # no threat model behind it.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: dark
      # Open straight on the surge board. uid is pinned in surge.json.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/surge.json
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/surge.json:/var/lib/grafana/dashboards/surge.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- The read/write split. OPT-IN: `make dev-replica`. ----------------------
  #
  # Behind a profile on purpose. IMPLEMENTATION.md §2.1 calls the replica a
  # nice-to-have that proves the split and must not block anything, and
  # DB_REPLICA_URL falls back to DB_URL — so a replica that will not come up
  # degrades to "works, just not split". Putting it in the default `up` would
  # invert that: a broken pg_basebackup would then be able to make `make dev`
  # look failed, which is exactly the dependency the demo must not have.
  postgres-replica:
    image: postgres:16-alpine
    container_name: playhack-postgres-replica
    profiles: ["replica"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: playhack
      PGDATA: /var/lib/postgresql/data/pgdata
    user: postgres
    ports:
      - "${REPLICA_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata_replica:/var/lib/postgresql/data
    # Streaming replica: pg_basebackup from the primary once, then start read-only.
    # -R writes standby.signal and primary_conninfo, which is what makes this a
    # standby rather than a second independent database — the distinction matters,
    # because the second kind would accept writes and silently diverge.
    #
    # entrypoint, not command: the postgres image's entrypoint would try to
    # initdb an empty PGDATA before the basebackup ever ran.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          rm -rf "$$PGDATA"
          until pg_basebackup -h postgres -p 5432 -U playhack -D "$$PGDATA" -Fp -Xs -R -w; do
            echo "waiting for primary..."; sleep 2
          done
          chmod 0700 "$$PGDATA"
        fi
        # A standby may not lower parameters that size shared recovery state
        # below the primary's values. The primary explicitly uses 200.
        exec postgres -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playhack -d playhack"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  pgdata_replica:
