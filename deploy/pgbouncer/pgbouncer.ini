[databases]
playhack = host=postgres port=5432 dbname=playhack

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Transaction mode. Each transaction gets a backend connection and gives it
; straight back — which is why nothing in this codebase may rely on
; session-scoped state (session advisory locks, prepared statements by name,
; SET without RESET). golang-migrate does take a session advisory lock, so
; `make migrate-up` connects direct to postgres:5432, not through here.
pool_mode = transaction
default_pool_size = 25
max_client_conn = 1000
reserve_pool_size = 5
reserve_pool_timeout = 3

; Lets the demo inspect pool saturation live:
;   psql postgres://playhack:playhack@localhost:6432/pgbouncer -c "SHOW POOLS;"
admin_users = playhack
stats_users = playhack

server_reset_query =
ignore_startup_parameters = extra_float_digits,options

log_connections = 0
log_disconnections = 0
